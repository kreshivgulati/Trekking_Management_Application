{% extends "base.html" %}
{% block title %}Login - Trek Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title mb-4 text-center">Login</h3>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>

                <hr>
                <p class="text-center mb-1">New here?</p>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('auth.register_trekker') }}" class="btn btn-outline-secondary w-50">Register as
                        Trekker</a>
                    <a href="{{ url_for('auth.register_staff') }}" class="btn btn-outline-secondary w-50">Register as
                        Staff</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
