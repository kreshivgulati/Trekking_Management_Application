{% extends "base.html" %}
{% block title %}Register as Trekker - Trek Management{% endblock %}

{% block content %}
<style>
    .auth-wrap {
        min-height: calc(100vh - 220px);
        display: flex;
        align-items: center;
        flex-direction: column;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem 0;
    }

    .go-back-btn {
        background: #fff;
        width: 12rem;
        height: 3.5rem;
        border-radius: 1rem;
        position: relative;
        color: var(--pine);
        font-size: 1.05rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
        overflow: hidden;
        align-self: flex-start;
        box-shadow: 0 2px 10px rgba(27, 67, 50, 0.08);
        text-decoration: none;
        display: block;
        margin-bottom: 1.5rem;
    }

    .go-back-circle {
        background: var(--moss-light);
        border-radius: 0.75rem;
        height: 3rem;
        width: 25%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 4px;
        top: 4px;
        z-index: 1;
        transition: width .5s ease;
    }

    .go-back-btn:hover .go-back-circle {
        width: 184px;
    }

    .go-back-text {
        position: relative;
        z-index: 0;
        display: block;
        text-align: center;
        line-height: 3.5rem;
        transform: translateX(0.5rem);
        color: var(--pine);
    }

    .go-back-circle svg path {
        fill: var(--pine);
    }

    .auth-card {
        border: none;
        border-radius: 1.25rem;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(27, 67, 50, 0.08);
        width: 100%;
    }

    .auth-banner {
        background: linear-gradient(135deg, var(--pine) 0%, var(--pine-dark) 100%);
        padding: 2rem 2rem 1.5rem;
        text-align: center;
        color: var(--sand);
        position: relative;
        overflow: hidden;
    }

    .auth-banner::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: repeating-linear-gradient(120deg, transparent 0 24px, rgba(255, 255, 255, 0.05) 24px 26px);
    }

    .auth-banner i {
        font-size: 2rem;
        color: var(--moss-light);
        position: relative;
    }

    .auth-banner h3 {
        font-weight: 700;
        color: #fff;
        margin: 0.5rem 0 0;
        position: relative;
    }

    .auth-banner p {
        color: rgba(254, 250, 224, 0.75);
        font-size: 0.85rem;
        margin: 0.25rem 0 0;
        position: relative;
    }

    .auth-body {
        padding: 2rem;
        background: #fff;
    }

    .auth-body .form-label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--pine);
    }

    .auth-body .input-group-text {
        background: var(--mist);
        border: 1px solid #E4E4D8;
        border-right: none;
        color: var(--stone);
    }

    .auth-body .form-control {
        border: 1px solid #E4E4D8;
        border-left: none;
        padding: 0.6rem 0.9rem;
    }

    .auth-body .input-group:focus-within .input-group-text,
    .auth-body .input-group:focus-within .form-control {
        border-color: var(--moss);
    }

    .auth-body .form-control:focus {
        box-shadow: none;
    }

    .auth-body .input-group:focus-within {
        box-shadow: 0 0 0 3px rgba(64, 145, 108, 0.15);
        border-radius: 0.6rem;
    }

    .btn-login {
        background: var(--moss);
        border: none;
        color: #fff;
        font-weight: 600;
        border-radius: 0.7rem;
        padding: 0.65rem;
        transition: background .15s ease, transform .15s ease;
    }

    .btn-login:hover {
        background: var(--pine);
        color: #fff;
        transform: translateY(-1px);
    }

    .auth-divider {
        display: flex;
        align-items: center;
        color: var(--stone);
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 1.5rem 0 1rem;
    }

    .auth-divider::before,
    .auth-divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #E4E4D8;
    }

    .auth-divider span {
        padding: 0 0.75rem;
    }
</style>

<div class="auth-wrap">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-5">

            <a href="{{ url_for('auth.login') }}" class="go-back-btn">
                <span class="go-back-circle">
                    <svg width="17" height="10" viewBox="0 0 46 40" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M46 20.038c0-.7-.3-1.5-.8-2.1l-16-17c-1.1-1-3.2-1.4-4.4-.3-1.2 1-1.4 3.2-.3 4.4L36.9 17H3.1C1.3 17 0 18.3 0 20s1.3 3 3.1 3h33.8L24.4 34.9c-1.1 1.1-1.2 3.3.3 4.4 1.5 1.1 3.3.7 4.4-.3l16-17c.5-.5.9-1.3.9-2z" />
                    </svg>
                </span>
                <span class="go-back-text">Go Back</span>
            </a>

            <div class="card auth-card">
                <div class="auth-banner">
                    <i class="bi bi-person-walking"></i>
                    <h3>Join as a Trekker</h3>
                    <p>Create an account to book your next trek</p>
                </div>

                <div class="auth-body">
                    <form method="POST" action="{{ url_for('auth.register_trekker') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" class="form-control" id="phone" name="phone">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required
                                    minlength="6">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirm_password"
                                    name="confirm_password" required minlength="6">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-login w-100 mt-2">
                            <i class="bi bi-person-check me-1"></i>Register
                        </button>
                    </form>

                    <div class="auth-divider"><span>Already a member?</span></div>

                    <a href="{{ url_for('auth.login') }}" class="btn btn-register w-100 d-block text-center"
                        style="border: 1.5px solid var(--moss); color: var(--moss); border-radius: 0.7rem; font-weight: 600; font-size: 0.85rem; padding: 0.6rem; text-decoration: none;">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login Instead
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
