{% extends "base.html" %}
{% block title %}My Profile | Trek Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold text-success text-center mb-1">Manage Profile</h3>
                <p class="text-muted text-center small mb-4">View and update your personal details or update your password.</p>

                <form method="POST" action="{{ url_for('trekker.edit_profile') }}">
                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control rounded-end-3" id="name" name="name" value="{{ current_user.name }}" required>
                        </div>
                    </div>
                    
                    <!-- Email Address -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control rounded-end-3" id="email" name="email" value="{{ current_user.email }}" required>
                        </div>
                    </div>
                    
                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control rounded-end-3" id="phone" name="phone" value="{{ current_user.phone or '' }}" placeholder="e.g., +91 99999 99999">
                        </div>
                    </div>
                    
                    <hr class="my-4 text-muted">
                    
                    <!-- Password Update Section -->
                    <h5 class="fw-bold text-dark mb-2">Update Password</h5>
                    <p class="text-muted small mb-3">Leave blank if you do not want to change your password.</p>
                    
                    <!-- New Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control rounded-end-3" id="password" name="password" minlength="6" placeholder="At least 6 characters">
                        </div>
                    </div>
                    
                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" class="form-control rounded-end-3" id="confirm_password" name="confirm_password" minlength="6" placeholder="Re-enter new password">
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-success w-100 rounded-3 py-2 fw-semibold shadow-sm mt-3">
                        <i class="bi bi-check2-circle me-1"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
